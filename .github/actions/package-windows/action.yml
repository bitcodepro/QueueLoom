name: Package Windows build
description: Publishes the single-file Windows executable and packages it as a ZIP with a SHA-256 checksum.

inputs:
  version:
    description: Semantic version stamped into QueueLoom.exe and used in the file name, e.g. 1.2.3 or 1.2.3-rc.1.
    required: true

outputs:
  zip:
    description: Path of the ZIP file.
    value: ${{ steps.package.outputs.zip }}
  checksum:
    description: Path of the .sha256 file.
    value: ${{ steps.package.outputs.checksum }}

runs:
  using: composite
  steps:
    - name: Publish single-file executable
      shell: pwsh
      run: >-
        dotnet publish src/QueueLoom.App/QueueLoom.App.csproj
        -p:PublishProfile=win-x64-single-file
        -p:Version=${{ inputs.version }}
        -o artifacts/publish

    - name: Package ZIP and checksum
      id: package
      shell: pwsh
      run: |
        $name = "QueueLoom-${{ inputs.version }}-win-x64.zip"
        $staging = 'artifacts/package'
        New-Item -ItemType Directory -Force $staging | Out-Null
        # Native symbol files are not needed at runtime and triple the download size.
        Get-ChildItem artifacts/publish -File | Where-Object Extension -ne '.pdb' | Copy-Item -Destination $staging
        Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination $staging
        Compress-Archive -Path "$staging/*" -DestinationPath "artifacts/$name" -Force
        $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
        # Same "<hash>  <file>" format as sha256sum, so `sha256sum -c` works.
        "$hash  $name" | Out-File -Encoding ascii -NoNewline "artifacts/$name.sha256"
        "zip=artifacts/$name" >> $env:GITHUB_OUTPUT
        "checksum=artifacts/$name.sha256" >> $env:GITHUB_OUTPUT
