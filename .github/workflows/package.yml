name: Package

# Builds the self-contained app for every platform and uploads one artifact per platform
# (QueueLoom-<rid>) holding the package and its .sha256 file. Called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app and the file names.
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-24.04
          # macOS packages are built on macOS: the app bundle has to be signed there.
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            # Run the Intel binary natively instead of relying on Rosetta on the ARM runner.
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ inputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Each artifact contains the release archive AND its checksum, not one raw file.
          archive: true
          name: QueueLoom-${{ matrix.rid }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
