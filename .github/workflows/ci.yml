name: CI

# Pull requests: build and test on Windows and Linux, and attach the Windows build.
# Merges to main: the same, then publish the next version as a GitHub Release.
#   The patch number is bumped by default; put [minor] or [major] in the first line of the
#   merge commit (the pull request title when squash-merging) for a bigger bump,
#   or [skip release] there to merge without releasing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'dev/**'
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump when run on main
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore QueueLoom.slnx --locked-mode

      - name: Build
        run: dotnet build QueueLoom.slnx -c Release --no-restore

      - name: Test
        run: dotnet test QueueLoom.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  emulator-tests:
    name: Emulator tests (Service Bus, SQS / SNS, Pub/Sub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start LocalStack, the Pub/Sub emulator and the Service Bus emulator
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=sqs,sns localstack/localstack:4.14
          docker run -d --name pubsub -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=queueloom-test
          docker network create servicebus
          docker run -d --name sqlserver --network servicebus -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=QueueLoom!Test123' \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Restore and build (locked)
        run: |
          dotnet restore QueueLoom.slnx --locked-mode
          dotnet build QueueLoom.slnx -c Release --no-restore

      - name: Wait for the emulators
        run: |
          # The Service Bus emulator needs SQL Server up; the build above gave it time to start.
          docker run -d --name servicebus --network servicebus -p 5672:5672 -p 5300:5300 \
            -e SQL_SERVER=sqlserver -e 'MSSQL_SA_PASSWORD=QueueLoom!Test123' -e ACCEPT_EULA=Y \
            -v "$PWD/tests/QueueLoom.IntegrationTests/ServiceBusEmulatorConfig.json:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:4566/_localstack/health | grep -q '"sqs": "\(available\|running\)"' &&
               curl -sf http://localhost:8085 >/dev/null &&
               curl -sf http://localhost:5300/health | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          docker logs localstack | tail -20; docker logs pubsub | tail -20; docker logs servicebus | tail -20
          exit 1

      - name: Test against the emulators
        env:
          QUEUELOOM_LOCALSTACK_URL: http://localhost:4566
          QUEUELOOM_PUBSUB_EMULATOR: localhost:8085
          QUEUELOOM_SERVICEBUS_EMULATOR: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
        run: >-
          dotnet test QueueLoom.slnx -c Release --no-build --logger trx --results-directory TestResults
          --filter "FullyQualifiedName~QueueLoom.IntegrationTests|FullyQualifiedName~RealCloudsUiTests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-emulators
          path: TestResults

  publish-windows:
    name: Publish Windows package
    if: github.event_name == 'pull_request'
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package
        id: package
        uses: ./.github/actions/package-windows
        with:
          version: 0.0.0-pr.${{ github.event.pull_request.number }}

      - uses: actions/upload-artifact@v4
        with:
          name: QueueLoom-win-x64
          path: ${{ steps.package.outputs.zip }}

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-and-test, emulator-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute next version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: ./.github/scripts/next-version.ps1 -Bump '${{ inputs.bump || 'auto' }}' -CommitMessage $env:COMMIT_MESSAGE

      - name: Package
        id: package
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/package-windows
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ steps.version.outputs.tag }}'
          '${{ steps.package.outputs.zip }}' '${{ steps.package.outputs.checksum }}'
          --target '${{ github.sha }}' --title '${{ steps.version.outputs.tag }}' --generate-notes
