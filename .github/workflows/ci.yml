name: CI

# Pull requests: build and test on Windows, Linux and macOS, and attach packages for all three.
# Merges to main: the same, then publish the next version as a GitHub Release.
#   The patch number is bumped by default; put [minor] or [major] in the first line of the
#   merge commit (the pull request title when squash-merging) for a bigger bump,
#   or [skip release] there to merge without releasing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'dev/**'
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump when run on main
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      image_cache_benchmark:
        description: Measure pinned image pull/save/local-load and corrupt-cache fallback (no cache writes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Restore (locked)
        run: |
          dotnet restore QueueLoom.slnx --locked-mode
          dotnet restore dev/QueueLoom.Lab/QueueLoom.Lab.csproj --locked-mode

      - name: Build
        run: |
          dotnet build QueueLoom.slnx -c Release --no-restore
          dotnet build dev/QueueLoom.Lab/QueueLoom.Lab.csproj -c Release --no-restore

      - name: Test
        run: dotnet test QueueLoom.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Collect unit test coverage
        if: matrix.os == 'ubuntu-24.04'
        run: dotnet test tests/QueueLoom.Tests/QueueLoom.Tests.csproj -c Release --no-build --collect "XPlat Code Coverage" --results-directory Coverage

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage
          path: Coverage/**/coverage.cobertura.xml
          archive: true
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  # Linux only: the emulators are Linux containers, which GitHub's Windows runners cannot run and its macOS
  # runners have no Docker for. The code they test is the same .NET on every system; the per-system parts
  # (paths, vault, notifications, updater) are covered by the build-and-test job above.
  emulator-tests:
    name: Emulator tests (Service Bus, SQS / SNS, Pub/Sub, RabbitMQ, Kafka)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Test runtime image cache validation and fallback
        run: |
          python3 -B -m unittest discover -s .github/scripts/tests -v
          python3 -O -B -m unittest discover -s .github/scripts/tests -v

      # The archive contains only six public images and integrity metadata, never Docker credentials.
      # Exact key only: an application commit cannot invalidate the image lock cache.
      - name: Restore pinned runtime images
        id: runtime-image-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ${{ runner.temp }}/queueloom-emulator-images-v1
          key: queueloom-runtime-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/emulator-images.lock.json') }}

      - name: Load and verify runtime images, or pull pinned images
        id: prepare-runtime-images
        env:
          WRITE_IMAGE_ARCHIVE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.runtime-image-cache.outputs.cache-hit != 'true' }}
        run: >-
          python3 -B .github/scripts/emulator_image_cache.py prepare
          --cache-dir '${{ runner.temp }}/queueloom-emulator-images-v1'
          --write-archive "$WRITE_IMAGE_ARCHIVE"
          --report '${{ runner.temp }}/runtime-image-metrics.json'

      - name: Start LocalStack, the Pub/Sub emulator, RabbitMQ, Kafka and the Service Bus emulator
        run: |
          docker run --pull=never --platform=linux/amd64 -d --name localstack -p 4566:4566 -e SERVICES=sqs,sns "$QUEUELOOM_LOCALSTACK_IMAGE"
          # 5672 belongs to the Service Bus emulator, so RabbitMQ listens on 5673 (management on 15673).
          docker run --pull=never --platform=linux/amd64 -d --name rabbitmq -p 5673:5672 -p 15673:15672 "$QUEUELOOM_RABBITMQ_IMAGE"
          docker run --pull=never --platform=linux/amd64 -d --name kafka -p 9092:9092 "$QUEUELOOM_KAFKA_IMAGE"
          docker run --pull=never --platform=linux/amd64 -d --name pubsub -p 8085:8085 "$QUEUELOOM_PUBSUB_IMAGE" \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=queueloom-test
          docker network create servicebus
          docker run --pull=never --platform=linux/amd64 -d --name sqlserver --network servicebus -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=QueueLoom!Test123' \
            "$QUEUELOOM_SQLSERVER_IMAGE"

      - name: Restore and build (locked)
        run: |
          dotnet restore QueueLoom.slnx --locked-mode
          dotnet build QueueLoom.slnx -c Release --no-restore

      - name: Wait for the emulators
        run: |
          # The Service Bus emulator needs SQL Server up; the build above gave it time to start.
          docker run --pull=never --platform=linux/amd64 -d --name servicebus --network servicebus -p 5672:5672 -p 5300:5300 \
            -e SQL_SERVER=sqlserver -e 'MSSQL_SA_PASSWORD=QueueLoom!Test123' -e ACCEPT_EULA=Y \
            -v "$PWD/tests/QueueLoom.IntegrationTests/ServiceBusEmulatorConfig.json:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            "$QUEUELOOM_SERVICEBUS_IMAGE"
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:4566/_localstack/health | grep -q '"sqs": "\(available\|running\)"' &&
               curl -sf http://localhost:8085 >/dev/null &&
               curl -sf http://localhost:5300/health | grep -q healthy &&
               curl -sf -u guest:guest http://localhost:15673/api/overview >/dev/null &&
               docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs localstack | tail -20; docker logs pubsub | tail -20; docker logs servicebus | tail -20; docker logs rabbitmq | tail -20; docker logs kafka | tail -20
          exit 1

      - name: Test against the emulators
        env:
          QUEUELOOM_LOCALSTACK_URL: http://localhost:4566
          QUEUELOOM_PUBSUB_EMULATOR: localhost:8085
          QUEUELOOM_SERVICEBUS_EMULATOR: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
          QUEUELOOM_RABBITMQ: localhost:5673
          QUEUELOOM_KAFKA: localhost:9092
        run: >-
          dotnet test QueueLoom.slnx -c Release --no-build --logger trx --results-directory TestResults
          --filter "FullyQualifiedName~QueueLoom.IntegrationTests|FullyQualifiedName~RealCloudsUiTests|FullyQualifiedName~RabbitMqUiTests|FullyQualifiedName~KafkaUiTests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-emulators
          path: TestResults

      - name: Save verified runtime images (trusted main only)
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.runtime-image-cache.outputs.cache-hit != 'true' &&
          steps.prepare-runtime-images.outputs.save-ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/queueloom-emulator-images-v1
          key: queueloom-runtime-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/emulator-images.lock.json') }}

      - name: Upload runtime image preparation measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-metrics
          path: ${{ runner.temp }}/runtime-image-metrics.json
          if-no-files-found: ignore
          retention-days: 7

  # Explicit, bounded test on a disposable runner. It never writes a GitHub cache.
  # A local archive load is not a measurement of downloading a warm GitHub cache.
  runtime-image-benchmark:
    name: Runtime image cold/local-warm benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.image_cache_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure all six images and invalid-cache fallback
        run: >-
          python3 -B .github/scripts/emulator_image_cache.py benchmark
          --cache-dir '${{ runner.temp }}/queueloom-image-benchmark'
          --report '${{ runner.temp }}/runtime-image-benchmark.json'
      - name: Upload image benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-benchmark
          path: ${{ runner.temp }}/runtime-image-benchmark.json
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Packages
    if: github.event_name == 'pull_request'
    needs: build-and-test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-pr.${{ github.event.pull_request.number }}

  verify-packages:
    name: Verify downloaded packages
    if: github.event_name == 'pull_request'
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QueueLoom-*
          path: packages
          merge-multiple: true
      - name: Check all four archives and SHA-256 checksums
        shell: pwsh
        run: ./.github/scripts/verify-packages.ps1 -Directory packages

  version:
    name: Next version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-and-test, emulator-tests]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: ./.github/scripts/next-version.ps1 -Bump '${{ inputs.bump || 'auto' }}' -CommitMessage $env:COMMIT_MESSAGE

  release-packages:
    name: Release packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Release
    needs: [version, release-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QueueLoom-*
          path: packages
          merge-multiple: true

      # Signs each archive with GitHub's free artifact attestations (Sigstore, no key of our own): anyone can check
      # that a package was built by this repository's workflow from this commit with
      #   gh attestation verify <archive> --repo bitcodepro/QueueLoom
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.zip
            packages/*.tar.gz

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ needs.version.outputs.tag }}' packages/*
          --repo '${{ github.repository }}' --target '${{ github.sha }}'
          --title '${{ needs.version.outputs.tag }}' --generate-notes
