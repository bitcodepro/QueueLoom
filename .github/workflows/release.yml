name: Release from tag

# Releases normally happen automatically after a merge to main (see ci.yml).
# Pushing a tag by hand still works, e.g. for a pre-release:
#   git tag v1.2.0-rc.1 && git push origin v1.2.0-rc.1
# Tags with a suffix such as -rc.1 are published as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a semantic version such as v1.2.3 or v1.2.3-rc.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore (locked)
        run: dotnet restore QueueLoom.slnx --locked-mode

      - name: Test
        run: dotnet test QueueLoom.slnx -c Release --no-restore

  packages:
    name: Packages
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.test.outputs.version }}

  release:
    name: Publish
    needs: [test, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QueueLoom-*
          path: packages
          merge-multiple: true

      # Signs each archive with GitHub's free artifact attestations (Sigstore, no key of our own): anyone can check
      # that a package was built by this repository's workflow from this commit with
      #   gh attestation verify <archive> --repo bitcodepro/QueueLoom
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.zip
            packages/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title '${{ github.ref_name }}' --repo '${{ github.repository }}')
          if [ '${{ needs.test.outputs.prerelease }}' = 'true' ]; then flags+=(--prerelease); fi
          gh release create '${{ github.ref_name }}' packages/* "${flags[@]}"
