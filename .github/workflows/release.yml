name: Release

# Push a tag such as v1.1.0 (or v1.1.0-rc.1 for a pre-release) to publish a GitHub Release
# with the self-contained Windows build. The version is taken from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Test, package and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a semantic version such as v1.2.3 or v1.2.3-rc.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore (locked)
        run: dotnet restore QueueLoom.slnx --locked-mode

      - name: Test
        run: dotnet test QueueLoom.slnx -c Release --no-restore

      - name: Publish single-file executable
        run: >-
          dotnet publish src/QueueLoom.App/QueueLoom.App.csproj
          -p:PublishProfile=win-x64-single-file
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish

      - name: Package ZIP and checksum
        id: package
        shell: pwsh
        run: |
          $name = "QueueLoom-${{ steps.version.outputs.version }}-win-x64.zip"
          $staging = 'artifacts/package'
          New-Item -ItemType Directory -Force $staging | Out-Null
          # Native symbol files are not needed at runtime and triple the download size.
          Get-ChildItem artifacts/publish -File | Where-Object Extension -ne '.pdb' | Copy-Item -Destination $staging
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Same "<hash>  <file>" format as sha256sum, so `sha256sum -c` works.
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "artifacts/$name.sha256"
          "zip=artifacts/$name" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--verify-tag', '--generate-notes', '--title', '${{ github.ref_name }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.zip }}' '${{ steps.package.outputs.zip }}.sha256' @flags
