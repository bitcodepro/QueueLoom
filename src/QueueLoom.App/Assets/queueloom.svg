<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0A6B61"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- Queue lanes -->
  <g fill="#FFFFFF">
    <rect x="224" y="300" width="576" height="80" rx="40"/>
    <rect x="224" y="472" width="576" height="80" rx="40" fill="#E3F8F4"/>
    <rect x="224" y="644" width="576" height="80" rx="40" fill="#C9EEE7"/>
